server:
  port: ${SERVER_PORT:8084}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/won_invest_core_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    crypto-secret: ${APP_SECURITY_CRYPTO_SECRET}

internal:
  auth:
    service-id: ${INTERNAL_SERVICE_ID}
    api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: won-invest-core
    metrics:
      distribution:
        percentiles-histogram:
          all: true
